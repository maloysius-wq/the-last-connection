name: Portable Windows build (Vulkan GPU + CPU fallback)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/portable_windows.yml'
      - 'portable/**'
      - 'ai_bridge/**'
      - 'godot/**'
      - 'data/**'
  push:
    branches: [main]
    tags: ['portable-v*']
    paths:
      - '.github/workflows/portable_windows.yml'
      - 'portable/**'
      - 'ai_bridge/**'
      - 'godot/**'
      - 'data/**'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Install Python packager
        run: python -m pip install pyinstaller==6.16.0
      - name: Package autonomous launcher and AI bridge on D-friendly local paths
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name TheLastConnection --paths . --add-data "data/characters/eli.json;data/characters" portable/launcher.py
      - name: Package independent Windows updater helper
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name TheLastConnectionUpdater --paths . portable/updater.py
          Copy-Item 'dist/TheLastConnectionUpdater.exe' 'dist/TheLastConnection/TheLastConnectionUpdater.exe' -Force
          if (!(Test-Path 'dist/TheLastConnection/TheLastConnectionUpdater.exe')) { throw 'Missing updater helper' }
          $updater = Join-Path (Get-Location).Path 'dist/TheLastConnection/TheLastConnectionUpdater.exe'
          $proc = Start-Process -FilePath $updater -ArgumentList @('--help') -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Packaged updater did not launch successfully: $($proc.ExitCode)" }
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false
          include-templates: true
      - name: Godot editor import (wait for Windows GUI process)
        shell: pwsh
        run: |
          $godotExe = Get-ChildItem "$env:USERPROFILE\godot" -File -Filter 'Godot*_win64.exe' | Select-Object -First 1
          if (!$godotExe) { throw "Godot Windows executable not found" }
          $stdout = Join-Path $env:RUNNER_TEMP 'godot-import.out'
          $stderr = Join-Path $env:RUNNER_TEMP 'godot-import.err'
          $process = Start-Process -FilePath $godotExe.FullName -ArgumentList @('--headless', '--path', 'godot', '--import', '--quit') -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($process.ExitCode -ne 0) { throw "Godot import exited $($process.ExitCode)" }
      - name: Export self-contained Windows game (wait and verify)
        shell: pwsh
        run: |
          $godotExe = Get-ChildItem "$env:USERPROFILE\godot" -File -Filter 'Godot*_win64.exe' | Select-Object -First 1
          if (!$godotExe) { throw "Godot Windows executable not found" }
          $target = Join-Path (Get-Location).Path 'dist\TheLastConnection\TheLastConnectionGame.exe'
          New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
          $stdout = Join-Path $env:RUNNER_TEMP 'godot-export.out'
          $stderr = Join-Path $env:RUNNER_TEMP 'godot-export.err'
          $arguments = @('--headless', '--path', 'godot', '--export-release', '"Windows Desktop"', ('"' + $target + '"'))
          $process = Start-Process -FilePath $godotExe.FullName -ArgumentList $arguments -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($process.ExitCode -ne 0) { throw "Godot export exited $($process.ExitCode)" }
          $game = Get-Item -LiteralPath $target -ErrorAction Stop
          if ($game.PSIsContainer -or $game.Length -lt 1000000) { throw "Missing/invalid Godot exe: $($game.Length) bytes" }
          Write-Host "Godot Windows executable exported: $($game.Length) bytes"
      - name: Download pinned CPU and Vulkan llama.cpp Windows runtimes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ 'User-Agent' = 'TLC-portable'; Authorization = "Bearer $env:GH_TOKEN" }
          # Pin both architectures to the same upstream build for predictable packaging.
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/b12551' -Headers $headers
          foreach ($backend in @('cpu', 'vulkan')) {
            $name = "llama-b12551-bin-win-$backend-x64.zip"
            $asset = $release.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if (!$asset) { throw "Missing pinned upstream runtime: $name" }
            $download = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $download
            $target = "dist/TheLastConnection/runtime/llama/$backend"
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Expand-Archive $download -DestinationPath $target -Force
            $bin = Get-ChildItem $target -Recurse -Filter 'llama-server.exe' | Select-Object -First 1
            if (!$bin) { throw "No llama-server.exe in $name" }
            if ($bin.Directory.FullName -ne (Resolve-Path $target).Path) {
              Copy-Item "$($bin.Directory.FullName)/*" $target -Recurse -Force
            }
            $server = Join-Path $target 'llama-server.exe'
            if (!(Test-Path $server -PathType Leaf)) { throw "Missing $backend model server" }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $server))
            if ($bytes.Length -lt 512 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) {
              throw "Invalid $backend Windows model server (not a PE executable)"
            }
            Write-Host "$backend llama.cpp server packaged ($((Get-Item $server).Length) bytes)"
          }
      - name: Bundle fully offline microphone and Eli voice engines
        shell: pwsh
        run: |
          # Whisper and Piper are pinned; no microphone bytes, dialogue or
          # speech synthesis leave this machine after installation.
          # Pinned upstream releases occasionally respond with a transient
          # 502/503. Retry the SAME URL instead of changing Eli's voice or
          # publishing a package with missing models.
          function Get-PinnedAsset {
            param(
              [Parameter(Mandatory=$true, Position=0)][string]$Uri,
              [Parameter(Mandatory=$true)][string]$OutFile
            )
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              try {
                Invoke-WebRequest -Uri $Uri -OutFile $OutFile -ErrorAction Stop -TimeoutSec 180
                if (!(Test-Path $OutFile -PathType Leaf) -or
                    (Get-Item $OutFile).Length -eq 0) {
                  throw 'Pinned asset download returned an empty file'
                }
                return
              } catch {
                if ($attempt -eq 4) { throw }
                Remove-Item -LiteralPath $OutFile -ErrorAction SilentlyContinue
                Write-Warning ("Pinned voice asset download attempt {0}/4 failed: {1}" -f $attempt, $_.Exception.Message)
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
          }
          $voiceRoot = 'dist/TheLastConnection/runtime/voice'
          New-Item -ItemType Directory -Force -Path "$voiceRoot/whisper","$voiceRoot/piper" | Out-Null
          $whisperArchive = Join-Path $env:RUNNER_TEMP 'whisper-bin-x64-v1.8.3.zip'
          Get-PinnedAsset 'https://github.com/ggml-org/whisper.cpp/releases/download/v1.8.3/whisper-bin-x64.zip' -OutFile $whisperArchive
          $whisperExtract = Join-Path $env:RUNNER_TEMP 'tlc-whisper'
          Expand-Archive $whisperArchive -DestinationPath $whisperExtract -Force
          $whisperExe = Get-ChildItem $whisperExtract -Filter whisper-cli.exe -Recurse | Select-Object -First 1
          if (!$whisperExe) { throw 'Pinned whisper.cpp archive did not contain whisper-cli.exe' }
          Copy-Item "$($whisperExe.Directory.FullName)/*" "$voiceRoot/whisper/" -Recurse -Force
          $piperArchive = Join-Path $env:RUNNER_TEMP 'piper_windows_amd64.zip'
          Get-PinnedAsset 'https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip' -OutFile $piperArchive
          $piperExtract = Join-Path $env:RUNNER_TEMP 'tlc-piper'
          Expand-Archive $piperArchive -DestinationPath $piperExtract -Force
          $piperExe = Get-ChildItem $piperExtract -Filter piper.exe -Recurse | Select-Object -First 1
          if (!$piperExe) { throw 'Pinned Piper archive did not contain piper.exe' }
          Copy-Item "$($piperExe.Directory.FullName)/*" "$voiceRoot/piper/" -Recurse -Force
          # This pinned historic voice is compatible with Piper 2023.11.14.
          # Its MODEL_CARD identifies Joe as CC0; do not substitute the newer
          # 1.5+-format weights without upgrading the synthesizer first.
          $joeBase = 'https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/joe/medium'
          Get-PinnedAsset "$joeBase/en_US-joe-medium.onnx" -OutFile "$voiceRoot/piper/en_US-joe-medium.onnx"
          Get-PinnedAsset "$joeBase/en_US-joe-medium.onnx.json" -OutFile "$voiceRoot/piper/en_US-joe-medium.onnx.json"
          Get-PinnedAsset "$joeBase/MODEL_CARD" -OutFile "$voiceRoot/piper/JOE_MODEL_CARD.txt"
          Get-PinnedAsset 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en-q5_1.bin' -OutFile "$voiceRoot/whisper/ggml-tiny.en-q5_1.bin"
          Get-PinnedAsset 'https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.8.3/LICENSE' -OutFile "$voiceRoot/whisper/WHISPER_LICENSE.txt"
          Get-PinnedAsset 'https://raw.githubusercontent.com/rhasspy/piper/2023.11.14-2/LICENSE.md' -OutFile "$voiceRoot/piper/PIPER_LICENSE.txt"
          foreach ($name in @("$voiceRoot/whisper/whisper-cli.exe", "$voiceRoot/piper/piper.exe")) {
            if (!(Test-Path $name -PathType Leaf)) { throw "Missing voice executable: $name" }
            $bin = [System.IO.File]::ReadAllBytes((Resolve-Path $name))
            if ($bin.Length -lt 512 -or $bin[0] -ne 77 -or $bin[1] -ne 90) {
              throw "Invalid PE voice executable: $name"
            }
          }
          if ((Get-Item "$voiceRoot/whisper/ggml-tiny.en-q5_1.bin").Length -lt 20000000) { throw 'Missing tiny.en speech recognizer model' }
          if ((Get-Item "$voiceRoot/piper/en_US-joe-medium.onnx").Length -lt 20000000) { throw 'Missing Joe synthesis model' }
          if ((Get-Item "$voiceRoot/piper/en_US-joe-medium.onnx.json").Length -lt 200) { throw 'Piper synthesis metadata missing' }
          Write-Host 'Offline voice executables and two voice models packaged.'

      - name: Smoke-test native Piper WAV output on Windows
        shell: pwsh
        run: |
          $voiceRoot = Join-Path (Get-Location).Path 'dist/TheLastConnection/runtime/voice'
          $exe = Join-Path $voiceRoot 'piper/piper.exe'
          $model = Join-Path $voiceRoot 'piper/en_US-joe-medium.onnx'
          $output = Join-Path $env:RUNNER_TEMP 'tlc-eli-smoke.wav'
          'Eli here. Can you hear me?' | & $exe --model $model --output_file $output
          if ($LASTEXITCODE -ne 0) { throw "Piper failed with code $LASTEXITCODE" }
          if (!(Test-Path $output)) { throw "Piper produced no WAV" }
          $audio = [System.IO.File]::ReadAllBytes($output)
          if ($audio.Length -lt 2048 -or
              [Text.Encoding]::ASCII.GetString($audio, 0, 4) -ne 'RIFF' -or
              [Text.Encoding]::ASCII.GetString($audio, 8, 4) -ne 'WAVE') {
            throw 'Piper produced an invalid or empty WAV'
          }
          # Feed the generated speech into the shipped Whisper model to
          # verify both portable native executables and model formats, not
          # merely their downloaded file sizes.
          $whisperExe = Join-Path $voiceRoot 'whisper/whisper-cli.exe'
          $whisperModel = Join-Path $voiceRoot 'whisper/ggml-tiny.en-q5_1.bin'
          $resampled = Join-Path $env:RUNNER_TEMP 'tlc-whisper-sample.wav'
          $transcript = Join-Path $env:RUNNER_TEMP 'tlc-whisper-check'
          $py = 'import wave,audioop,sys; r=wave.open(sys.argv[1],"rb"); f=r.readframes(r.getnframes()); b,_=audioop.ratecv(f,2,r.getnchannels(),r.getframerate(),16000,None); w=wave.open(sys.argv[2],"wb"); w.setnchannels(r.getnchannels()); w.setsampwidth(2); w.setframerate(16000); w.writeframes(b); w.close()'
          & python -c $py $output $resampled
          if ($LASTEXITCODE -ne 0) { throw 'Could not convert Piper audio for Whisper verification' }
          & $whisperExe -m $whisperModel -f $resampled -l en -nt -np -otxt -of $transcript
          if ($LASTEXITCODE -ne 0) { throw "whisper-cli failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "$transcript.txt")) { throw 'Whisper did not produce a transcript file' }
          Remove-Item $output,$resampled,"$transcript.txt" -Force
          Write-Host 'Piper spoke and whisper.cpp transcribed completely offline on Windows.'

      - name: Include portable guide and exact version metadata
        shell: pwsh
        run: |
          @{"tag" = "portable-$env:GITHUB_SHA"; "commit" = "$env:GITHUB_SHA"; "channel" = "$env:GITHUB_REF_NAME"} | ConvertTo-Json -Compress | Set-Content -Encoding utf8 'dist/TheLastConnection/build-info.json'
          Copy-Item 'portable/README.md' 'dist/TheLastConnection/READ_ME_FIRST.md'
          Copy-Item 'portable/SETUP_CHATTERBOX_NANO.cmd','portable/SETUP_CHATTERBOX_NANO_CUDA.cmd','portable/setup_nano.ps1','portable/nano_voice_worker.py','portable/SETUP_NATIVE_NANO.cmd','portable/SETUP_NATIVE_NANO_VULKAN.cmd','portable/setup_native_nano.ps1' 'dist/TheLastConnection/'
          Set-Content -Encoding ascii -Path 'dist/TheLastConnection/portable-build.txt' -Value "No AI model bundled. First launch selects an existing GGUF or downloads Qwen3 Q4_K_M (~2.5GB) into models/ with approval. GPU Vulkan is tried first, CPU fallback included."
          New-Item -ItemType Directory -Force -Path 'dist/TheLastConnection/LICENSES' | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/ggml-org/llama.cpp/master/LICENSE' -OutFile 'dist/TheLastConnection/LICENSES/llama.cpp-MIT.txt'
          Invoke-WebRequest 'https://raw.githubusercontent.com/godotengine/godot/master/LICENSE.txt' -OutFile 'dist/TheLastConnection/LICENSES/Godot-MIT.txt'
          if (!(Test-Path 'dist/TheLastConnection/TheLastConnection.exe')) { throw 'Missing launcher' }
          if (!(Test-Path 'dist/TheLastConnection/TheLastConnectionUpdater.exe')) { throw 'Missing updater' }
          if (!(Test-Path 'dist/TheLastConnection/build-info.json')) { throw 'Missing version metadata' }
          foreach ($backend in @('cpu','vulkan')) {
            if (!(Test-Path "dist/TheLastConnection/runtime/llama/$backend/llama-server.exe")) { throw "Missing $backend model runtime" }
          }
          $game = Get-Item -LiteralPath 'dist/TheLastConnection/TheLastConnectionGame.exe' -Force -ErrorAction Stop
          if ($game.PSIsContainer -or $game.Length -lt 1000000) { throw "Exported game exe is missing or invalid: $($game.Length) bytes" }
          # Windows export template can retain the Hidden file attribute; ensure
          # artifact upload includes the executable rather than silently skipping it.
          Write-Host "Exported game: $($game.FullName) ($($game.Length) bytes), attributes $($game.Attributes)"
          $game.Attributes = $game.Attributes -band (-bnot [System.IO.FileAttributes]::Hidden)
          if (!(Test-Path -PathType Leaf 'dist/TheLastConnection/TheLastConnectionGame.exe')) { throw 'Game exe disappeared before upload' }
      - uses: actions/upload-artifact@v4
        with:
          name: TheLastConnection-Windows-GPU-Portable
          path: dist/TheLastConnection
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish permanent versioned GitHub Release for in-game updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Join-Path (Get-Location).Path 'TheLastConnection-Windows-Portable.zip'
          if (Test-Path $archive) { Remove-Item $archive -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path 'dist/TheLastConnection').Path, $archive,
            [System.IO.Compression.CompressionLevel]::Optimal, $false)
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TheLastConnection-Windows-Portable.zip" | Set-Content -Encoding utf8 'SHA256SUMS.txt'
          $tag = "portable-$env:GITHUB_SHA"
          # Retry transient GitHub API failures. Stage as draft so the updater
          # never sees an incomplete release, and don't overwrite published assets.
          $notes = "Windows portable build with in-game updater, local dialogue and optional native Nano voice. No GGUF weights bundled."
          function Read-Release {
            $raw = gh release view $tag --json tagName,isDraft,targetCommitish,assets 2>$null
            if ($LASTEXITCODE -eq 0) { return ($raw | ConvertFrom-Json) }
            return $null
          }
          $release = Read-Release
          for ($attempt=0; !$release -and $attempt -lt 4; $attempt++) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "The Last Connection | $($env:GITHUB_SHA.Substring(0, 8))" --notes $notes
            $release = Read-Release
            if (!$release) { Start-Sleep -Seconds (5 * ($attempt + 1)) }
          }
          if (!$release -or $release.targetCommitish -ne $env:GITHUB_SHA) { throw 'Could not stage exact commit release' }
          if ($release.isDraft) {
            $uploaded = $false
            for ($attempt=0; !$uploaded -and $attempt -lt 4; $attempt++) {
              gh release upload $tag $archive 'SHA256SUMS.txt' --clobber
              $uploaded = ($LASTEXITCODE -eq 0)
              if (!$uploaded) { Start-Sleep -Seconds (5 * ($attempt + 1)) }
            }
            if (!$uploaded) { throw 'Release asset upload failed' }
            $release = Read-Release
            $zipAsset = @($release.assets | Where-Object { $_.name -eq 'TheLastConnection-Windows-Portable.zip' })
            $sumAsset = @($release.assets | Where-Object { $_.name -eq 'SHA256SUMS.txt' })
            if ($zipAsset.Count -ne 1 -or $zipAsset[0].size -ne (Get-Item $archive).Length -or $sumAsset.Count -ne 1 -or $sumAsset[0].size -ne (Get-Item 'SHA256SUMS.txt').Length) { throw 'Incomplete draft assets' }
            for ($attempt=0; $release.isDraft -and $attempt -lt 4; $attempt++) {
              gh release edit $tag --draft=false --latest
              $release = Read-Release
              if (!$release) { throw 'Cannot verify release state' }
              if ($release.isDraft) { Start-Sleep -Seconds (5 * ($attempt + 1)) }
            }
          }
          $release = Read-Release
          if (!$release -or $release.isDraft -or $release.targetCommitish -ne $env:GITHUB_SHA -or @($release.assets | Where-Object { $_.name -eq 'TheLastConnection-Windows-Portable.zip' -and $_.size -gt 1000000 }).Count -ne 1 -or @($release.assets | Where-Object { $_.name -eq 'SHA256SUMS.txt' -and $_.size -gt 0 }).Count -ne 1) { throw 'Release publication verification failed' }
          Write-Host "Verified published release: $tag"
