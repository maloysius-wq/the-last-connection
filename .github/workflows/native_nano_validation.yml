name: Native Nano Windows setup and persistent synthesis
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'portable/setup_native_nano.ps1'
      - 'ai_bridge/native_nano.py'
      - '.github/workflows/native_nano_validation.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-pinned native runtime and render actual audio (Windows PowerShell 5.1)
        shell: powershell
        run: |
          & ./portable/setup_native_nano.ps1
          if (!(Test-Path 'portable/models/chatterbox-nano-native/ready.json')) { throw 'Native Nano not ready' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exercise game adapter and reuse server; test clone reference
        shell: pwsh
        run: |
          python tests/native_nano_real_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-nano-comparison
          path: |
            portable/models/chatterbox-nano-native/sample*.wav
            portable/models/chatterbox-nano-native/adapter*.wav
            portable/models/chatterbox-nano-native/ready.json
            portable/logs/nano-native.log
          if-no-files-found: error
          retention-days: 14
      - name: Show native setup logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-Content portable/models/chatterbox-nano-native/setup-server*.log -Tail 100 -ErrorAction SilentlyContinue
          Get-Content portable/logs/nano-native.log -Tail 100 -ErrorAction SilentlyContinue
